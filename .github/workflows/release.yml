name: Release

# Manual only. Bump expo.version / ios.buildNumber / android.versionCode in app.json first.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store to upload to
        type: choice
        options: [both, ios, android]
        default: both
      play_status:
        description: Play release status (use draft until the app's first release is live)
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  ios:
    name: TestFlight
    if: inputs.platform != 'android'
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: npm ci

      - name: Prebuild
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        run: cd ios && pod install --repo-update

      # The archive is unsigned; export signs it with a cloud-managed distribution
      # certificate, which needs an Admin API key and no registered device.
      - name: Install API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive
        run: |
          set -o pipefail
          cd ios
          xcodebuild archive \
            -workspace Kitefold.xcworkspace \
            -scheme Kitefold \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kitefold.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | xcbeautify --renderer github-actions

      - name: Upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kitefold.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | xcbeautify --renderer github-actions

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  android:
    name: Play internal testing
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Install upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          # Without it the plugin falls back to the debug key, which Play rejects.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundle
        env:
          KITEFOLD_STORE_FILE: ${{ runner.temp }}/upload.jks
          KITEFOLD_STORE_PASSWORD: ${{ secrets.KITEFOLD_STORE_PASSWORD }}
          KITEFOLD_KEY_ALIAS: ${{ secrets.KITEFOLD_KEY_ALIAS }}
          KITEFOLD_KEY_PASSWORD: ${{ secrets.KITEFOLD_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease --no-daemon

      # Kept for the very first upload, which Play only accepts through the Console.
      - uses: actions/upload-artifact@v5
        with:
          name: kitefold-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.owaiskhan.kitefold
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.play_status }}

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
